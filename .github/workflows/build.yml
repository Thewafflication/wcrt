name: Build and test WCRT

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    name: TC-0016 source quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Install Doxygen
        shell: pwsh
        run: choco install doxygen.install --no-progress -y

      - name: Verify pinned WSP common tools
        shell: pwsh
        run: |
          ./wsp/tools/tests/run-tests.ps1
          # Negative tool tests deliberately leave LASTEXITCODE at 1. The
          # runner throws for an actual failure, so reaching this line means
          # the controlled suite passed.
          $global:LASTEXITCODE = 0

      - name: Verify requirements traceability
        shell: pwsh
        run: ./tests/verify-traceability.ps1

      - name: Run TC-0016
        id: tc0016
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/test-results/source-quality | Out-Null
          try {
            $result = ./tests/c89/run-tc-0016.ps1
            if ($result.Status -ne 'Pass') { throw $result.Output }
          } catch {
            $result = [PSCustomObject]@{
              TestCase = 'TC-0016'
              Status = 'Fail'
              Output = $_.Exception.Message
            }
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content output/test-results/source-quality/tc-0016.json -Encoding utf8NoBOM
          if ($result.Status -ne 'Pass') { exit 1 }

      - name: Publish source-quality summary
        if: always()
        shell: pwsh
        run: |
          $result = Get-Content output/test-results/source-quality/tc-0016.json -Raw | ConvertFrom-Json
          $status = $result.Status.ToUpperInvariant()
          $indicator = if ($status -eq 'PASS') { '🟢' } else { '🔴' }
          @(
            '# WCRT Test Report'
            ''
            '| Test Case | Result |'
            '| --- | --- |'
            "| TC-0016 Source documentation and physical line length | $indicator **$status** |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Enforce source-quality result
        if: steps.tc0016.outcome != 'success'
        shell: pwsh
        run: throw 'TC-0016 failed. See the source-quality summary.'

  build:
    name: ${{ matrix.arch }}
    needs: source-quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2025
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Use isolated WPM data directory
        shell: pwsh
        run: '"WPM_DATA_DIR=$env:RUNNER_TEMP\wpm-data" >> $env:GITHUB_ENV'

      - name: Install WPM
        shell: pwsh
        run: |
          $version = '1.0.16'
          $archive = Join-Path $env:RUNNER_TEMP "wpm-${{ matrix.arch }}-$version.zip"
          $expected = @{
            x86 = 'a143aecee32afa6cee04023f299a98058820824df40a9e845327594e4902643c'
            x64 = '6553898f4e0bfbf171f601c16d314259fd28f59e7398d58a0549208b011c6544'
            arm64 = 'ed685fcd26a7d37d2c814146faded71377b233939730e9e8ddaabcec455962c9'
          }['${{ matrix.arch }}']
          $base = 'https://github.com/Thewafflication/wpm/releases/download/1.0.16'
          Invoke-WebRequest -UseBasicParsing "$base/wpm-${{ matrix.arch }}-$version.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned WPM archive digest mismatch.'
          }
          $package = Join-Path $env:RUNNER_TEMP 'wpm-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          & (Join-Path $package 'setup.cmd') (Join-Path $package 'wpm.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wpmDirectory = Join-Path $env:ProgramFiles 'WPM'
          if (-not (Test-Path (Join-Path $wpmDirectory 'wpm.exe'))) { throw 'WPM installation failed.' }
          $reported = (& (Join-Path $wpmDirectory 'wpm.exe') --version 2>&1) -join "`n"
          if ($reported -notmatch 'Version 1\.0\.16') { throw "Unexpected WPM version: $reported" }
          $wpmDirectory >> $env:GITHUB_PATH

      - name: Install TinyCC WPM package
        shell: pwsh
        run: ./tools/install-latest-tinycc-wpm-package.ps1 -Architecture '${{ matrix.arch }}'

      - name: Install cv2pdb WPM package
        shell: pwsh
        run: |
          $version = '0.54.0'
          $base = 'https://github.com/Thewafflication/cv2pdb_package/releases/download/cv2pdb-0.54.0'
          $key = Join-Path $env:RUNNER_TEMP 'cv2pdb-wpm-release.public'
          Invoke-WebRequest -UseBasicParsing "$base/wpm-release.public" -OutFile $key
          if ((Get-FileHash -LiteralPath $key -Algorithm SHA256).Hash -ne 'dc3245f3cab87c6e53cd8bad9c0fbeaf2951029adf819e900479e47cbf13285e') {
            throw 'Pinned cv2pdb release-key digest mismatch.'
          }
          wpm trust add $key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wpm repo add $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wpm update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wpm install cv2pdb --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cv2pdbHome = [Environment]::GetEnvironmentVariable('CV2PDB_HOME', 'Machine')
          $cv2pdb = Join-Path $cv2pdbHome 'cv2pdb.exe'
          if (-not (Test-Path -LiteralPath $cv2pdb)) { throw "cv2pdb was not installed at $cv2pdb." }
          $cv2pdbHome >> $env:GITHUB_PATH

      - name: Record dependency provenance
        shell: pwsh
        run: |
          $directory = 'output/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $cv2pdbHome = [Environment]::GetEnvironmentVariable('CV2PDB_HOME', 'Machine')
          $cv2pdb = Join-Path $cv2pdbHome 'cv2pdb.exe'
          [PSCustomObject]@{
            Architecture = '${{ matrix.arch }}'
            RunnerImage = '${{ matrix.runner }}'
            WpmVersion = '1.0.16'
            TinyCcSelection = 'latest eligible WPM package at job execution'
            TinyCcRepository = $env:TINYCC_WPM_REPOSITORY
            TinyCcVersion = $env:TINYCC_PACKAGE_VERSION
            TinyCcSourceRevision = $env:TINYCC_SOURCE_REVISION
            TinyCcPackageSha256 = $env:TINYCC_PACKAGE_SHA256
            TinyCcReleaseKeySha256 = $env:TINYCC_RELEASE_KEY_SHA256
            TinyCcSha256 = (Get-FileHash -LiteralPath $env:TINYCC -Algorithm SHA256).Hash
            Cv2pdbVersion = '0.54.0'
            Cv2pdbSourceRevision = '25cfecaad700550a49cd7ddbf7773254ea438d07'
            Cv2pdbSha256 = (Get-FileHash -LiteralPath $cv2pdb -Algorithm SHA256).Hash
            WspRevision = (git -C wsp rev-parse HEAD)
          } | ConvertTo-Json -Depth 3 |
            Set-Content "$directory/dependency-provenance.json" -Encoding utf8NoBOM

      - name: Verify automatic native failure diagnostics
        id: native_diagnostics
        continue-on-error: true
        shell: pwsh
        run: ./tests/verify-native-test-diagnostics.ps1 -Architecture '${{ matrix.arch }}' -TinyCc $env:TINYCC

      - name: Build debug DLL and PDB
        shell: pwsh
        run: ./tools/build-wcrt.ps1 -Architecture '${{ matrix.arch }}' -Configuration Debug -TinyCc $env:TINYCC

      - name: Probe TinyCC C99 capabilities and data model
        id: capabilities
        continue-on-error: true
        shell: pwsh
        run: ./tools/test-tinycc-capabilities.ps1 -Architecture '${{ matrix.arch }}' -TinyCc $env:TINYCC

      - name: Verify Windows 2000 x86 imports
        if: matrix.arch == 'x86'
        id: win2000_imports
        continue-on-error: true
        shell: pwsh
        run: ./tools/test-windows-2000-imports.ps1 -Binary output/build/x86/Debug/wcrt.dll

      - name: Verify DLL and static-library consumers
        shell: pwsh
        run: ./tools/test-built-libraries.ps1 -Architecture '${{ matrix.arch }}' -Configuration Debug -TinyCc $env:TINYCC

      - name: Verify Windows startup objects
        id: startup
        continue-on-error: true
        shell: pwsh
        run: |
          $directory = 'output/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          try {
            $results = @(./tools/test-startup-objects.ps1 -Architecture '${{ matrix.arch }}' -Configuration Debug -TinyCc $env:TINYCC)
          } catch {
            $results = @(
              [PSCustomObject]@{ TestCase = 'TC-0017'; Status = 'Fail'; Output = $_.Exception.Message }
              [PSCustomObject]@{ TestCase = 'TC-0018'; Status = 'Fail'; Output = $_.Exception.Message }
            )
          }
          ConvertTo-Json -InputObject $results -Depth 4 |
            Set-Content "$directory/startup-test-results.json" -Encoding utf8NoBOM
          if (@($results | Where-Object Status -ne 'Pass').Count -ne 0) { exit 1 }

      - name: Run C89 tests
        id: c89
        continue-on-error: true
        shell: pwsh
        run: ./tools/run-c89-tests.ps1 -Architecture '${{ matrix.arch }}' -TinyCc $env:TINYCC

      - name: Run C99 and compatibility tests
        id: extensions
        continue-on-error: true
        shell: pwsh
        run: ./tools/run-extension-tests.ps1 -Architecture '${{ matrix.arch }}' -TinyCc $env:TINYCC

      - name: Add ordered test tables to job summary
        if: always()
        shell: pwsh
        run: |
          $directory = 'output/test-results/${{ matrix.arch }}'
          @(
            '# WCRT Test Report'
            ''
            '## ${{ matrix.arch }} Debug'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          function Open-TestSuite {
            param([string]$Name, [object[]]$Results)
            $blocked = @($Results | Where-Object Status -eq 'Blocked').Count
            $expected = @($Results | Where-Object {
                $_.Status -eq 'ExpectedFail'
              }).Count
            $failed = @($Results | Where-Object {
                $_.Status -notin 'Pass', 'Blocked', 'ExpectedFail'
              }).Count
            if ($Results.Count -eq 0 -or $failed -ne 0) {
              $indicator = '❌'
              $status = 'FAIL'
              $open = ' open'
            } elseif ($blocked -ne 0) {
              $indicator = '⚠️'
              $status = 'BLOCKED'
              $open = ' open'
            } elseif ($expected -ne 0) {
              $indicator = '⚠️'
              $status = 'EXPECTED FAIL'
              $open = ' open'
            } else {
              $indicator = '✅'
              $status = 'PASS'
              $open = ''
            }
            @(
              ''
              "<details$open>"
              "<summary>$indicator <strong>$Name — $status</strong></summary>"
              ''
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          function Close-TestSuite {
            @('', '</details>') |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          function Write-FailureDetails {
            param(
              [string]$Name,
              [object[]]$Results,
              [string]$DetailProperty = 'Output'
            )
            $failures = @(
              $Results | Where-Object {
                $_.Status -notin 'Pass', 'Blocked', 'ExpectedFail'
              }
            )
            if ($failures.Count -eq 0) { return }
            @('', "### Failure details — $Name") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            foreach ($failure in $failures) {
              $title = if ($failure.TestCase) {
                "$($failure.TestCase) $($failure.Description)".Trim()
              } else { $Name }
              $detail = $failure.PSObject.Properties[$DetailProperty].Value
              if ([string]::IsNullOrWhiteSpace([string]$detail)) {
                $detail = 'The runner did not provide diagnostic text.'
              }
              $encoded = [System.Net.WebUtility]::HtmlEncode([string]$detail)
              @(
                ''
                '<details open>'
                "<summary>🔴 <strong>$title — FAIL</strong></summary>"
                ''
                "<pre>$encoded</pre>"
                '</details>'
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

          function Write-ExpectedFailureDetails {
            param([string]$Name, [object[]]$Results)
            $expected = @($Results | Where-Object Status -eq 'ExpectedFail')
            if ($expected.Count -eq 0) { return }
            @('', "### Expected compiler failures — $Name") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            foreach ($result in $expected) {
              $encoded = [System.Net.WebUtility]::HtmlEncode(
                [string]$result.Output)
              @(
                ''
                '<details>'
                "<summary>🟡 <strong>$($result.TestCase) — EXPECTED FAIL</strong></summary>"
                ''
                "<pre>$encoded</pre>"
                '</details>'
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

          $c89Json = "$directory/c89-test-results.json"
          $c89 = @(
            if (Test-Path $c89Json) {
              try {
                @(Get-Content $c89Json -Raw | ConvertFrom-Json)
              } catch {
                [PSCustomObject]@{
                  TestCase = 'C89 runner'
                  Description = 'Unreadable result file'
                  Status = 'Fail'
                  Details = $_.Exception.Message
                }
              }
            } else {
              [PSCustomObject]@{
                TestCase = 'C89 runner'
                Description = 'Result file missing'
                Status = 'Fail'
                Details = 'Runner outcome: ${{ steps.c89.outcome }}'
              }
            }
          )
          Open-TestSuite 'ISO C89 library' $c89
          @('| Test Case | Result |', '| --- | --- |') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $c89 | Sort-Object TestCase | ForEach-Object {
              $status = $_.Status.ToUpperInvariant()
              $indicator = if ($status -eq 'PASS') { '🟢' } else { '🔴' }
              "| $($_.TestCase) $($_.Description) | $indicator **$status** |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Close-TestSuite
          Write-FailureDetails 'ISO C89 library' $c89 'Details'

          $extensionJson = "$directory/extension-test-results.json"
          $extensions = @(
            if (Test-Path $extensionJson) {
              try {
                @(Get-Content $extensionJson -Raw | ConvertFrom-Json)
              } catch {
                foreach ($suiteName in @('C99', 'Microsoft compatibility')) {
                  [PSCustomObject]@{
                    TestCase = "$suiteName runner"
                    Requirement = 'Runner'
                    Suite = $suiteName
                    Description = 'Unreadable result file'
                    Status = 'Fail'
                    Output = $_.Exception.Message
                  }
                }
              }
            } else {
              foreach ($suiteName in @('C99', 'Microsoft compatibility')) {
                [PSCustomObject]@{
                  TestCase = "$suiteName runner"
                  Requirement = 'Runner'
                  Suite = $suiteName
                  Description = 'Result file missing'
                  Status = 'Fail'
                  Output = 'Runner outcome: ${{ steps.extensions.outcome }}'
                }
              }
            }
          )
          foreach ($suite in @('C99', 'Microsoft compatibility')) {
            $name = if ($suite -eq 'C99') {
              'ISO C99 extensions'
            } else { $suite }
            $suiteResults = @($extensions | Where-Object Suite -eq $suite)
            Open-TestSuite $name $suiteResults
            @('| Test Case | Result |', '| --- | --- |') |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $suiteResults | Sort-Object TestCase | ForEach-Object {
                $status = $_.Status.ToUpperInvariant()
                $indicator = if ($status -eq 'PASS') { '🟢' } `
                  elseif ($status -eq 'EXPECTEDFAIL') { '🟡' } else { '🔴' }
                "| $($_.TestCase) $($_.Description) | $indicator **$status** |" |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            Close-TestSuite
            Write-FailureDetails $name $suiteResults
            Write-ExpectedFailureDetails $name $suiteResults
          }

          $capabilityJson = "$directory/tinycc-c99-capabilities.json"
          $capability = if (Test-Path $capabilityJson) {
            Get-Content $capabilityJson -Raw | ConvertFrom-Json
          } else { $null }
          $capabilityResults = if ($null -eq $capability) {
            @()
          } else { @($capability.Probes) }
          $capabilityGateResults = @(
            foreach ($probe in $capabilityResults) {
              [PSCustomObject]@{
                Status = if ($probe.Status -eq 'Supported') { 'Pass' }
                  elseif ($probe.Status -eq 'ExpectedFail') { 'ExpectedFail' }
                  elseif ($probe.RequiredForCurrentBaseline) { 'Fail' }
                  else { 'Blocked' }
              }
            }
            if ($null -ne $capability) {
              [PSCustomObject]@{ Status = $capability.DataModel.Status }
            }
          )
          Open-TestSuite 'TinyCC C99 capabilities' $capabilityGateResults
          @('| Facility | Baseline | Result |', '| --- | --- | --- |') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($probe in $capabilityResults) {
            $supported = $probe.Status -eq 'Supported'
            $indicator = if ($supported) { '🟢' } else { '🟡' }
            $baseline = if ($probe.RequiredForCurrentBaseline) {
              'Required now'
            } else { 'Future input' }
            "| $($probe.Facility) | $baseline | $indicator **$($probe.Status.ToUpperInvariant())** |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if ($null -ne $capability) {
            "| Data model ($($capability.DataModel.Model)) | Required now | 🟢 **$($capability.DataModel.Status.ToUpperInvariant())** |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Close-TestSuite

          $diagnosticJson = "$directory/native-test-diagnostics.json"
          $nativeDiagnostics = if (Test-Path $diagnosticJson) {
            Get-Content $diagnosticJson -Raw | ConvertFrom-Json
          } else { $null }
          $diagnosticRows = if ($null -eq $nativeDiagnostics) { @() } else {
            @([PSCustomObject]@{ Status = $nativeDiagnostics.Status })
          }
          Open-TestSuite 'Native crash diagnostics' $diagnosticRows
          @(
            '| Built-in backtrace | GDB | Result |'
            '| --- | --- | --- |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($null -ne $nativeDiagnostics) {
            $status = $nativeDiagnostics.Status.ToUpperInvariant()
            $indicator = if ($status -eq 'PASS') { '🟢' } else { '🔴' }
            "| $($nativeDiagnostics.BuiltInBacktrace) | $($nativeDiagnostics.DebuggerStatus) | $indicator **$status** |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Close-TestSuite

          if ('${{ matrix.arch }}' -eq 'x86') {
            $importJson = "$directory/windows-2000-imports.json"
            $importResult = if (Test-Path $importJson) {
              Get-Content $importJson -Raw | ConvertFrom-Json
            } else { $null }
            $importRows = if ($null -eq $importResult) { @() } else {
              @([PSCustomObject]@{ Status = $importResult.Status })
            }
            Open-TestSuite 'Windows 2000 x86 imports' $importRows
            @('| Binary | Imports | Result |', '| --- | ---: | --- |') |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($null -ne $importResult) {
              $status = $importResult.Status.ToUpperInvariant()
              $indicator = if ($status -eq 'PASS') { '🟢' } else { '🔴' }
              "| $($importResult.Binary) | $(@($importResult.Imports).Count) | $indicator **$status** |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            Close-TestSuite
          }

          $startupJson = "$directory/startup-test-results.json"
          $startup = if (Test-Path $startupJson) {
            @(Get-Content $startupJson -Raw | ConvertFrom-Json)
          } else {
            @(
              [PSCustomObject]@{ TestCase = 'TC-0017'; Status = 'Fail' }
              [PSCustomObject]@{ TestCase = 'TC-0018'; Status = 'Fail' }
            )
          }
          Open-TestSuite 'Windows startup objects' $startup
          @(
            '| Test Case | Startup object | Result |'
            '| --- | --- | --- |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $startupNames = @{
            'TC-0017' = 'Console (`main`)'
            'TC-0018' = 'GUI (`WinMain`)'
          }
          $startup | Sort-Object TestCase | ForEach-Object {
            $status = $_.Status.ToUpperInvariant()
            $indicator = if ($status -eq 'PASS') { '🟢' } `
              elseif ($status -eq 'BLOCKED') { '🟡' } else { '🔴' }
            "| $($_.TestCase) | $($startupNames[$_.TestCase]) | $indicator **$status** |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Close-TestSuite
          @(
            ''
            'The DLL, debug symbols, and test evidence are attached to this workflow run as the architecture-specific debug artifact.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload debug artifacts and TeX report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-${{ matrix.arch }}-debug
          path: |
            output/build/${{ matrix.arch }}/Debug/wcrt.dll
            output/build/${{ matrix.arch }}/Debug/wcrt.pdb
            output/build/${{ matrix.arch }}/Debug/wcrt.def
            output/build/${{ matrix.arch }}/Debug/libwcrt.a
            output/build/${{ matrix.arch }}/Debug/libwcrt-tinycc-complex-abi.a
            output/build/${{ matrix.arch }}/Debug/wcrt-startup-console.o
            output/build/${{ matrix.arch }}/Debug/wcrt-startup-gui.o
            output/build/${{ matrix.arch }}/Debug/include/
            output/build/${{ matrix.arch }}/Debug/c99-complex-capability.json
            output/test-results/${{ matrix.arch }}/c89-test-results.tex
            output/test-results/${{ matrix.arch }}/c89-test-results.json
            output/test-results/${{ matrix.arch }}/extension-test-results.json
            output/test-results/${{ matrix.arch }}/tinycc-c99-capabilities.json
            output/test-results/${{ matrix.arch }}/windows-2000-imports.json
            output/test-results/${{ matrix.arch }}/startup-test-results.json
            output/test-results/${{ matrix.arch }}/native-test-diagnostics.json
            output/test-results/${{ matrix.arch }}/dependency-provenance.json
            output/test-results/${{ matrix.arch }}/diagnostics/
          if-no-files-found: error

      - name: Attach dependency provenance to verified debug build
        shell: pwsh
        run: |
          Copy-Item `
            'output/test-results/${{ matrix.arch }}/dependency-provenance.json' `
            'output/build/${{ matrix.arch }}/Debug/dependency-provenance.json'

      - name: Upload verified debug build for packaging
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-${{ matrix.arch }}-debug-build
          path: output/build/${{ matrix.arch }}/Debug/*
          if-no-files-found: error
          compression-level: 0

      - name: Enforce C89 result
        if: steps.c89.outcome != 'success'
        shell: pwsh
        run: throw 'C89 verification failed. See the job summary.'

      - name: Enforce native failure diagnostics
        if: steps.native_diagnostics.outcome != 'success'
        shell: pwsh
        run: throw 'Native failure-diagnostic verification failed. See the job summary.'

      - name: Enforce Windows startup result
        if: steps.startup.outcome != 'success'
        shell: pwsh
        run: throw 'Windows startup-object verification failed. See the job summary.'

      - name: Enforce C99 and compatibility results
        if: steps.extensions.outcome != 'success'
        shell: pwsh
        run: throw 'C99 or compatibility verification failed. See the job summary.'

      - name: Enforce TinyCC C99 capability baseline
        if: steps.capabilities.outcome != 'success'
        shell: pwsh
        run: throw 'TinyCC C99 capability or data-model verification failed. See the job summary.'

      - name: Enforce Windows 2000 x86 imports
        if: matrix.arch == 'x86' && steps.win2000_imports.outcome != 'success'
        shell: pwsh
        run: throw 'Windows 2000 x86 import verification failed. See the job summary.'

  debug-package:
    name: Build multi-architecture Debug WPM package
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Use isolated WPM data directory
        shell: pwsh
        run: '"WPM_DATA_DIR=$env:RUNNER_TEMP\wpm-data" >> $env:GITHUB_ENV'

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: wcrt-*-debug-build
          path: downloaded-builds

      - name: Assemble architecture build directories
        shell: pwsh
        run: |
          $tinyCcVersions = @()
          foreach ($architecture in @('x86', 'x64', 'arm64')) {
            $source = "downloaded-builds/wcrt-$architecture-debug-build"
            $destination = "output/build/$architecture/Debug"
            if (-not (Test-Path -LiteralPath "$source/wcrt.dll" -PathType Leaf)) {
              throw "Debug build for $architecture was not downloaded."
            }
            $provenancePath = "$source/dependency-provenance.json"
            if (-not (Test-Path -LiteralPath $provenancePath -PathType Leaf)) {
              throw "TinyCC provenance for $architecture was not downloaded."
            }
            $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
            $tinyCcVersions += $provenance.TinyCcVersion
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item -Path "$source/*" -Destination $destination -Recurse
          }
          $distinctVersions = @($tinyCcVersions | Sort-Object -Unique)
          if ($distinctVersions.Count -ne 1) {
            throw "Debug targets selected different latest TinyCC packages: $($distinctVersions -join ', ')."
          }
          "All Debug targets selected TinyCC $($distinctVersions[0])."

      - name: Install WPM
        shell: pwsh
        run: |
          $version = '1.0.16'
          $archive = Join-Path $env:RUNNER_TEMP "wpm-x64-$version.zip"
          $expected = '6553898f4e0bfbf171f601c16d314259fd28f59e7398d58a0549208b011c6544'
          $base = 'https://github.com/Thewafflication/wpm/releases/download/1.0.16'
          Invoke-WebRequest -UseBasicParsing "$base/wpm-x64-$version.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned WPM archive digest mismatch.'
          }
          $package = Join-Path $env:RUNNER_TEMP 'wpm-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          & (Join-Path $package 'setup.cmd') (Join-Path $package 'wpm.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wpmDirectory = Join-Path $env:ProgramFiles 'WPM'
          $reported = (& (Join-Path $wpmDirectory 'wpm.exe') --version 2>&1) -join "`n"
          if ($reported -notmatch 'Version 1\.0\.16') { throw "Unexpected WPM version: $reported" }
          $wpmDirectory >> $env:GITHUB_PATH

      - name: Build unsigned Debug WPM package
        shell: pwsh
        run: ./tools/build-wpm-package.ps1 -Version '0.0.0' -Configuration Debug -PackageName wcrt-debug

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-debug-any-package
          path: output/packages/wcrt-debug-any-*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    name: ${{ matrix.arch }} release
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2025
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Use isolated WPM data directory
        shell: pwsh
        run: '"WPM_DATA_DIR=$env:RUNNER_TEMP\wpm-data" >> $env:GITHUB_ENV'

      - name: Install WPM
        shell: pwsh
        run: |
          $version = '1.0.16'
          $archive = Join-Path $env:RUNNER_TEMP "wpm-${{ matrix.arch }}-$version.zip"
          $expected = @{
            x86 = 'a143aecee32afa6cee04023f299a98058820824df40a9e845327594e4902643c'
            x64 = '6553898f4e0bfbf171f601c16d314259fd28f59e7398d58a0549208b011c6544'
            arm64 = 'ed685fcd26a7d37d2c814146faded71377b233939730e9e8ddaabcec455962c9'
          }['${{ matrix.arch }}']
          $base = 'https://github.com/Thewafflication/wpm/releases/download/1.0.16'
          Invoke-WebRequest -UseBasicParsing "$base/wpm-${{ matrix.arch }}-$version.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned WPM archive digest mismatch.'
          }
          $package = Join-Path $env:RUNNER_TEMP 'wpm-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          & (Join-Path $package 'setup.cmd') (Join-Path $package 'wpm.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wpmDirectory = Join-Path $env:ProgramFiles 'WPM'
          if (-not (Test-Path (Join-Path $wpmDirectory 'wpm.exe'))) { throw 'WPM installation failed.' }
          $reported = (& (Join-Path $wpmDirectory 'wpm.exe') --version 2>&1) -join "`n"
          if ($reported -notmatch 'Version 1\.0\.16') { throw "Unexpected WPM version: $reported" }
          $wpmDirectory >> $env:GITHUB_PATH

      - name: Install TinyCC WPM package
        shell: pwsh
        run: ./tools/install-latest-tinycc-wpm-package.ps1 -Architecture '${{ matrix.arch }}'

      - name: Download Debug dependency baseline
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: wcrt-${{ matrix.arch }}-debug-build
          path: debug-baseline

      - name: Verify TinyCC matches the tested Debug baseline
        shell: pwsh
        run: |
          $provenance = Get-Content -LiteralPath `
            'debug-baseline/dependency-provenance.json' -Raw | ConvertFrom-Json
          if ($provenance.TinyCcVersion -ne $env:TINYCC_PACKAGE_VERSION) {
            throw "Latest TinyCC changed during the run: Debug used $($provenance.TinyCcVersion), Release selected $env:TINYCC_PACKAGE_VERSION. Rerun the workflow."
          }

      - name: Build release DLL and static library
        shell: pwsh
        run: ./tools/build-wcrt.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -TinyCc $env:TINYCC -Version '${{ github.ref_name }}'

      - name: Record release dependency provenance
        shell: pwsh
        run: |
          [PSCustomObject]@{
            Architecture = '${{ matrix.arch }}'
            RunnerImage = '${{ matrix.runner }}'
            WpmVersion = '1.0.16'
            TinyCcSelection = 'latest eligible WPM package at job execution'
            TinyCcRepository = $env:TINYCC_WPM_REPOSITORY
            TinyCcVersion = $env:TINYCC_PACKAGE_VERSION
            TinyCcSourceRevision = $env:TINYCC_SOURCE_REVISION
            TinyCcPackageSha256 = $env:TINYCC_PACKAGE_SHA256
            TinyCcReleaseKeySha256 = $env:TINYCC_RELEASE_KEY_SHA256
            TinyCcSha256 = (Get-FileHash -LiteralPath $env:TINYCC -Algorithm SHA256).Hash
            WspRevision = (git -C wsp rev-parse HEAD)
          } | ConvertTo-Json -Depth 3 |
            Set-Content 'output/build/${{ matrix.arch }}/Release/dependency-provenance.json' -Encoding utf8NoBOM

      - name: Verify release Windows 2000 x86 imports
        if: matrix.arch == 'x86'
        shell: pwsh
        run: ./tools/test-windows-2000-imports.ps1 -Binary output/build/x86/Release/wcrt.dll

      - name: Verify release libraries
        shell: pwsh
        run: ./tools/test-built-libraries.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -TinyCc $env:TINYCC

      - name: Verify release Windows startup objects
        id: startup
        continue-on-error: true
        shell: pwsh
        run: |
          $directory = 'output/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          try {
            $results = @(./tools/test-startup-objects.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -TinyCc $env:TINYCC)
          } catch {
            $results = @(
              [PSCustomObject]@{ TestCase = 'TC-0017'; Status = 'Fail'; Output = $_.Exception.Message }
              [PSCustomObject]@{ TestCase = 'TC-0018'; Status = 'Fail'; Output = $_.Exception.Message }
            )
          }
          ConvertTo-Json -InputObject $results -Depth 4 |
            Set-Content "$directory/startup-release-test-results.json" -Encoding utf8NoBOM
          if (@($results | Where-Object Status -ne 'Pass').Count -ne 0) { exit 1 }

      - name: Add release Windows startup table to job summary
        if: always()
        shell: pwsh
        run: |
          $json = 'output/test-results/${{ matrix.arch }}/startup-release-test-results.json'
          $results = if (Test-Path $json) {
            @(Get-Content $json -Raw | ConvertFrom-Json)
          } else {
            @(
              [PSCustomObject]@{ TestCase = 'TC-0017'; Status = 'Fail' }
              [PSCustomObject]@{ TestCase = 'TC-0018'; Status = 'Fail' }
            )
          }
          @(
            '## Windows startup objects — ${{ matrix.arch }} Release'
            ''
            '| Test Case | Startup object | Result |'
            '| --- | --- | --- |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $names = @{
            'TC-0017' = 'Console (`main`)'
            'TC-0018' = 'GUI (`WinMain`)'
          }
          foreach ($result in $results) {
            $status = $result.Status.ToUpperInvariant()
            $indicator = if ($status -eq 'PASS') { '🟢' } elseif ($status -eq 'BLOCKED') { '🟡' } else { '🔴' }
            "| $($result.TestCase) | $($names[$result.TestCase]) | $indicator **$status** |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Enforce release Windows startup result
        if: steps.startup.outcome != 'success'
        shell: pwsh
        run: throw 'Release startup-object verification failed. See the job summary.'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-${{ matrix.arch }}-release-build
          path: output/build/${{ matrix.arch }}/Release/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload release Windows 2000 x86 import evidence
        if: matrix.arch == 'x86'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-x86-release-import-evidence
          path: output/test-results/x86/windows-2000-imports.json
          if-no-files-found: error

  package:
    if: startsWith(github.ref, 'refs/tags/')
    name: Build multi-architecture WPM package
    needs: release
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Use isolated WPM data directory
        shell: pwsh
        run: '"WPM_DATA_DIR=$env:RUNNER_TEMP\wpm-data" >> $env:GITHUB_ENV'

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: wcrt-*-release-build
          path: downloaded-builds

      - name: Assemble architecture build directories
        shell: pwsh
        run: |
          $tinyCcVersions = @()
          foreach ($architecture in @('x86', 'x64', 'arm64')) {
            $source = "downloaded-builds/wcrt-$architecture-release-build"
            $destination = "output/build/$architecture/Release"
            if (-not (Test-Path -LiteralPath "$source/wcrt.dll" -PathType Leaf)) {
              throw "Release build for $architecture was not downloaded."
            }
            $provenancePath = "$source/dependency-provenance.json"
            if (-not (Test-Path -LiteralPath $provenancePath -PathType Leaf)) {
              throw "TinyCC provenance for $architecture was not downloaded."
            }
            $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
            $tinyCcVersions += $provenance.TinyCcVersion
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item -Path "$source/*" -Destination $destination -Recurse
          }
          $distinctVersions = @($tinyCcVersions | Sort-Object -Unique)
          if ($distinctVersions.Count -ne 1) {
            throw "Release targets selected different TinyCC packages: $($distinctVersions -join ', ')."
          }
          "All Release targets selected TinyCC $($distinctVersions[0])."

      - name: Install WPM
        shell: pwsh
        run: |
          $version = '1.0.16'
          $archive = Join-Path $env:RUNNER_TEMP "wpm-x64-$version.zip"
          $expected = '6553898f4e0bfbf171f601c16d314259fd28f59e7398d58a0549208b011c6544'
          $base = 'https://github.com/Thewafflication/wpm/releases/download/1.0.16'
          Invoke-WebRequest -UseBasicParsing "$base/wpm-x64-$version.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned WPM archive digest mismatch.'
          }
          $package = Join-Path $env:RUNNER_TEMP 'wpm-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          & (Join-Path $package 'setup.cmd') (Join-Path $package 'wpm.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wpmDirectory = Join-Path $env:ProgramFiles 'WPM'
          $reported = (& (Join-Path $wpmDirectory 'wpm.exe') --version 2>&1) -join "`n"
          if ($reported -notmatch 'Version 1\.0\.16') { throw "Unexpected WPM version: $reported" }
          $wpmDirectory >> $env:GITHUB_PATH

      - name: Build and verify WPM-signed package
        shell: pwsh
        env:
          WPM_PRIVATE_KEY: ${{ secrets.WPM_RELEASE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WPM_PRIVATE_KEY)) { throw 'The release environment must define WPM_RELEASE_PRIVATE_KEY.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'wcrt-release.private'
          try {
            [IO.File]::WriteAllText($keyPath, $env:WPM_PRIVATE_KEY)
            ./tools/build-wpm-package.ps1 -Version '${{ github.ref_name }}' -SigningKey $keyPath
            $package = @(Get-ChildItem output/packages/wcrt-any-*.zip -File)
            if ($package.Count -ne 1) { throw "Expected one package, found $($package.Count)." }
            wpm trust add release_keys/wpm-release.public
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $verifyOutput = @(wpm verify $package[0].FullName 2>&1)
            $verifyExitCode = $LASTEXITCODE
            $verifyOutput | Write-Output
            New-Item -ItemType Directory -Force output/test-results/release | Out-Null
            [PSCustomObject]@{
              schemaVersion = 1
              generatedAtUtc = [DateTime]::UtcNow.ToString('o')
              package = $package[0].Name
              packageSha256 = (Get-FileHash -LiteralPath $package[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              trustedPublicKeySha256 = (Get-FileHash -LiteralPath release_keys/wpm-release.public -Algorithm SHA256).Hash.ToLowerInvariant()
              exitCode = $verifyExitCode
              result = if ($verifyExitCode -eq 0) { 'Pass' } else { 'Fail' }
              output = @($verifyOutput | ForEach-Object ToString)
            } | ConvertTo-Json -Depth 5 |
              Set-Content output/test-results/release/wpm-verification.json -Encoding utf8NoBOM
            if ($verifyExitCode -ne 0) { exit $verifyExitCode }
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify packaged DLL identities
        shell: pwsh
        run: |
          $package = @(Get-ChildItem output/packages/wcrt-any-*.zip -File)
          if ($package.Count -ne 1) { throw "Expected one package, found $($package.Count)." }
          ./tools/test-wpm-package-authenticode.ps1 `
            -Package $package[0].FullName `
            -SkipAuthenticode `
            -SourceRevision '${{ github.sha }}' `
            -OutputPath output/test-results/release/package-dll-identities.json

      - name: Retain WPM package evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-wpm-package-evidence
          path: output/test-results/release/*.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wcrt-any-release
          path: output/packages/wcrt-any-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish GitHub release
    needs: package
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: wcrt-any-release
          path: release-assets
          merge-multiple: true

      - name: Create WPM repository index
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid semantic-version release tag: $tag" }
          $assets = (Resolve-Path release-assets).Path
          Copy-Item release_keys/wpm-release.public (Join-Path $assets 'wpm-release.public')
          $packages = foreach ($file in Get-ChildItem $assets -Filter 'wcrt-*.zip' -File) {
            if ($file.Name -notmatch '^wcrt-any-(.+)\.zip$') { throw "Unexpected package filename: $($file.Name)" }
            [ordered]@{
              name = 'wcrt'
              version = $Matches[1]
              arch = 'any'
              url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($file.Name)"
            }
          }
          if (@($packages).Count -ne 1) { throw 'Expected exactly one multi-architecture WCRT package.' }
          [ordered]@{ version = 1; packages = @($packages) } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $assets 'index.json') -Encoding utf8NoBOM

      - name: Generate release checksums
        shell: pwsh
        run: |
          $assets = (Resolve-Path release-assets).Path
          $files = @(Get-ChildItem $assets -File | Select-Object -ExpandProperty FullName)
          ./wsp/tools/New-ArtifactChecksum.ps1 `
            -Path $files `
            -OutputPath (Join-Path $assets 'SHA256SUMS')

      - name: Create release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem release-assets -File)
          gh release upload $tag --repo '${{ github.repository }}' --clobber @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
